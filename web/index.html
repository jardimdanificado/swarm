<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swarm // WebAssembly 2.0 Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐜</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="vendor/blockly.min.js"></script>
</head>
<body class="mobile-view-editor">

    <!-- Header Toolbar -->
    <header>
        <h1>
            <span>🐜 swarm</span>
        </h1>

        <div class="actions">
            <!-- Run / Stop Button -->
            <button id="btn-run" class="btn-play-toggle" title="Run Program (Space)">
                <svg class="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <svg class="icon-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="6" width="12" height="12"></rect>
                </svg>
            </button>

            <!-- Example Selector -->
            <div class="project-toolbar">
                <label for="example-select" style="font-size: 11px; color: var(--text-dim); font-weight: 700;">Example:</label>
                <select id="example-select"></select>
            </div>

            <button id="btn-compile" class="btn-accent" title="Compile to Wasm">
                <span>🔨 Compile</span>
            </button>

            <button id="btn-export-wasm" title="Download compiled .wasm binary">
                <span>📦 Export .wasm</span>
            </button>

            <button id="btn-export-spp" title="Save .spp project (JSON)">
                <span>💾 Save .spp</span>
            </button>

            <button id="btn-import-spp" title="Open .spp project">
                <span>📂 Open</span>
            </button>
            <input type="file" id="file-input-spp" accept=".spp,.json" style="display: none;">

            <button id="btn-decompile-wasm" class="btn-accent" style="background: #6c5ce7;" title="Decompile binary .wasm or text .wat into visual blocks">
                <span>📥 Decompile Wasm/WAT</span>
            </button>
            <input type="file" id="file-input-wasm" accept=".wasm,.wat" style="display: none;">

            <button id="btn-clear" title="Clear Workspace">
                <span>🗑️ Clear</span>
            </button>
        </div>
    </header>

    <!-- Main Studio Split Workspace -->
    <main class="workspace-grid">
        <!-- Left: Function Navigator Sidebar (Paging) -->
        <aside class="function-navigator-pane" id="func-navigator">
            <div class="navigator-header">
                <span style="font-weight: 800; font-size: 11px; letter-spacing: 0.5px;">🐜 FUNCTIONS</span>
                <span id="func-count-badge" class="badge-count">0</span>
            </div>
            <div class="navigator-search">
                <input type="text" id="func-search-input" placeholder="🔍 Filter functions...">
            </div>
            <div class="navigator-actions">
                <button class="nav-btn active" id="btn-view-all" data-view="all">🌐 View All</button>
                <button class="nav-btn" id="btn-view-overview" data-view="overview">📋 Module / Globals</button>
            </div>
            <div class="func-list" id="func-list-container">
                <!-- Dynamic function items -->
            </div>
        </aside>

        <!-- Center: Blockly Canvas -->
        <div class="editor-pane">
            <div id="blockly-div"></div>
        </div>

        <!-- Right: Inspector / Console / Wasm Display -->
        <aside class="inspector-pane">
            <nav class="tab-nav">
                <button class="tab-btn active" data-tab="tab-console">📟 Console</button>
                <button class="tab-btn" data-tab="tab-wasm">📦 Wasm Binary</button>
                <button class="tab-btn" data-tab="tab-ir">🔍 AST / IR</button>
            </nav>

            <!-- Tab 1: Console -->
            <div id="tab-console" class="tab-content active">
                <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                    <span style="color: var(--text-dim); font-weight: bold;">Wasm Runtime Output:</span>
                    <button id="btn-clear-console" style="padding: 2px 6px; font-size: 10px;">Clear Logs</button>
                </div>
                <div id="console-output"></div>
            </div>

            <!-- Tab 2: Wasm Disassembly / Hex View -->
            <div id="tab-wasm" class="tab-content">
                <div id="wasm-summary" style="margin-bottom: 8px; color: #55efc4; font-weight: bold;"></div>
                <div id="wasm-hex" class="code-viewer">No module compiled yet. Click "Compile".</div>
            </div>

            <!-- Tab 3: AST / IR Debug -->
            <div id="tab-ir" class="tab-content">
                <div id="ir-viewer" class="code-viewer">No IR generated.</div>
            </div>
        </aside>
    </main>

    <!-- Mobile Bottom Navigation Bar (Active on Mobile / Small Screens) -->
    <nav class="mobile-tab-bar" id="mobile-tab-bar">
        <button class="mobile-tab-btn" data-mobile-view="nav" title="Functions Navigator">
            <span class="mobile-tab-icon">📁</span>
            <span class="mobile-tab-label">Functions</span>
        </button>
        <button class="mobile-tab-btn active" data-mobile-view="editor" title="Blocks Workspace">
            <span class="mobile-tab-icon">🧱</span>
            <span class="mobile-tab-label">Blocks</span>
        </button>
        <button class="mobile-tab-btn" data-mobile-view="inspector" title="Console & Output">
            <span class="mobile-tab-icon">📟</span>
            <span class="mobile-tab-label">Output</span>
        </button>
    </nav>

    <!-- Footer Status -->
    <footer class="chalk-footer">
        <div id="status-left">🐜 swarm Studio Ready.</div>
        <div id="status-right">100% WebAssembly 2.0 • Full Opcode Coverage</div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast-notification" class="toast">Notification</div>

    <!-- Decompile Progress Overlay Modal -->
    <div id="progress-modal" class="progress-overlay" style="display: none;">
        <div class="progress-card">
            <div class="progress-title" id="progress-title">🐜 Processing WebAssembly...</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%;"></div>
            </div>
            <div class="progress-status" id="progress-status">Starting...</div>
        </div>
    </div>

    <!-- Blockly Toolbox XML Definition: 100% WebAssembly Instructions -->
    <xml id="toolbox" style="display: none">
        <category name="Control & Flow" colour="#d97706">
            <block type="spp_start"></block>
            <block type="spp_block"></block>
            <block type="spp_loop"></block>
            <block type="spp_if"></block>
            <block type="spp_repeat">
                <value name="TIMES">
                    <block type="spp_const_i32"><field name="VALUE">10</field></block>
                </value>
            </block>
            <block type="spp_while"></block>
            <block type="spp_br"></block>
            <block type="spp_br_if"></block>
            <block type="spp_br_table"></block>
            <block type="spp_select"></block>
            <block type="spp_return"></block>
            <block type="spp_drop"></block>
            <block type="spp_nop"></block>
            <block type="spp_unreachable"></block>
            <block type="spp_inline_wat"></block>
        </category>

        <category name="i32 (Integer 32)" colour="#3b82f6">
            <block type="spp_const_i32"></block>
            <block type="spp_declare_i32"></block>
            <block type="spp_global_i32"></block>
            <block type="spp_param_i32"></block>
            <block type="spp_get_i32"></block>
            <block type="spp_i32_binop"></block>
            <block type="spp_i32_relop"></block>
            <block type="spp_i32_unop"></block>
            <block type="spp_i32_load"></block>
            <block type="spp_i32_store"></block>
        </category>

        <category name="i64 (Integer 64)" colour="#1d4ed8">
            <block type="spp_const_i64"></block>
            <block type="spp_declare_i64"></block>
            <block type="spp_global_i64"></block>
            <block type="spp_param_i64"></block>
            <block type="spp_get_i64"></block>
            <block type="spp_i64_binop"></block>
            <block type="spp_i64_relop"></block>
            <block type="spp_i64_unop"></block>
            <block type="spp_i64_load"></block>
            <block type="spp_i64_store"></block>
        </category>

        <category name="f32 (Float 32)" colour="#10b981">
            <block type="spp_const_f32"></block>
            <block type="spp_declare_f32"></block>
            <block type="spp_global_f32"></block>
            <block type="spp_param_f32"></block>
            <block type="spp_get_f32"></block>
            <block type="spp_f32_binop"></block>
            <block type="spp_f32_relop"></block>
            <block type="spp_f32_unop"></block>
            <block type="spp_f32_load"></block>
            <block type="spp_f32_store"></block>
        </category>

        <category name="f64 (Float 64)" colour="#047857">
            <block type="spp_const_f64"></block>
            <block type="spp_declare_f64"></block>
            <block type="spp_global_f64"></block>
            <block type="spp_param_f64"></block>
            <block type="spp_get_f64"></block>
            <block type="spp_f64_binop"></block>
            <block type="spp_f64_relop"></block>
            <block type="spp_f64_unop"></block>
            <block type="spp_f64_load"></block>
            <block type="spp_f64_store"></block>
        </category>

        <category name="Conversions & Casts" colour="#059669">
            <block type="spp_f32_convert_i32"></block>
            <block type="spp_f64_convert_i32"></block>
            <block type="spp_f64_convert_i64"></block>
            <block type="spp_i32_trunc_f32"></block>
            <block type="spp_i32_trunc_f64"></block>
            <block type="spp_i64_trunc_f32"></block>
            <block type="spp_i64_trunc_f64"></block>
            <block type="spp_f64_promote_f32"></block>
            <block type="spp_f32_demote_f64"></block>
            <block type="spp_i64_extend_i32"></block>
            <block type="spp_i32_wrap_i64"></block>
            <block type="spp_reinterpret_f32_as_i32"></block>
            <block type="spp_reinterpret_i32_as_f32"></block>
            <block type="spp_reinterpret_f64_as_i64"></block>
            <block type="spp_reinterpret_i64_as_f64"></block>
            <block type="spp_convert"></block>
            <block type="spp_reinterpret"></block>
        </category>

        <category name="Linear Memory (Wasm)" colour="#475569">
            <block type="spp_mem_load"></block>
            <block type="spp_mem_store"></block>
            <block type="spp_mem_grow"></block>
            <block type="spp_mem_size"></block>
            <block type="spp_alloc_buffer"></block>
            <block type="spp_declare_buffer"></block>
            <block type="spp_param_buffer"></block>
        </category>

        <category name="Functions & Modules" colour="#9333ea">
            <block type="spp_function_def"></block>
            <block type="spp_param"></block>
            <block type="spp_param_i32"></block>
            <block type="spp_param_f32"></block>
            <block type="spp_param_f64"></block>
            <block type="spp_param_bool"></block>
            <block type="spp_param_func"></block>
            <block type="spp_call_stmt"></block>
            <block type="spp_call_expr"></block>
            <block type="spp_function_ptr"></block>
            <block type="spp_call_indirect"></block>
            <block type="spp_import_func"></block>
            <block type="spp_import_global"></block>
            <block type="spp_export_decl"></block>
            <block type="spp_start_func"></block>
        </category>

        <category name="Variables & Assignment" colour="#3b82f6">
            <block type="spp_set"></block>
            <block type="spp_tee"></block>
            <block type="spp_get"></block>
            <block type="spp_declare"></block>
            <block type="spp_global_declare"></block>
        </category>

        <category name="Boolean, Text & Host" colour="#8b5cf6">
            <block type="spp_const_bool"></block>
            <block type="spp_declare_bool"></block>
            <block type="spp_get_bool"></block>
            <block type="spp_param_bool"></block>
            <block type="spp_const_text"></block>
            <block type="spp_declare_texto"></block>
            <block type="spp_string_concat"></block>
            <block type="spp_print"></block>
        </category>

        <category name="Wasm 2.0: SIMD 128 (v128)" colour="#ec4899">
            <block type="spp_v128_const"></block>
            <block type="spp_v128_splat"></block>
            <block type="spp_v128_extract_lane"></block>
            <block type="spp_v128_replace_lane"></block>
            <block type="spp_v128_binop"></block>
            <block type="spp_v128_bitselect"></block>
            <block type="spp_v128_load"></block>
            <block type="spp_v128_store"></block>
        </category>

        <category name="Wasm 2.0: References & Tables" colour="#84cc16">
            <block type="spp_table_declare"></block>
            <block type="spp_ref_null"></block>
            <block type="spp_ref_is_null"></block>
            <block type="spp_ref_func"></block>
            <block type="spp_table_get"></block>
            <block type="spp_table_set"></block>
            <block type="spp_table_size"></block>
            <block type="spp_table_grow"></block>
            <block type="spp_table_fill"></block>
            <block type="spp_table_copy"></block>
            <block type="spp_table_init"></block>
            <block type="spp_elem_drop"></block>
        </category>

        <category name="Wasm 2.0: Bulk Memory & Extensions" colour="#059669">
            <block type="spp_sign_extend"></block>
            <block type="spp_trunc_sat"></block>
            <block type="spp_mem_copy"></block>
            <block type="spp_mem_fill"></block>
            <block type="spp_mem_init"></block>
            <block type="spp_data_drop"></block>
            <block type="spp_return_call"></block>
            <block type="spp_return_call_indirect"></block>
        </category>
    </xml>

    <!-- Studio Entry Point -->
    <script type="module" src="app.js"></script>
</body>
</html>
